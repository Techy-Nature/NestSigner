plugins {
    id "com.android.application"
}

android {
    namespace "io.github.techynature.nestsigner"
    compileSdk 35

    defaultConfig {
        applicationId "io.github.techynature.nestsigner"
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName "1.3"
    }

    // Optional release signing. Fill in keystore.properties (see README) to enable it;
    // without it, `assembleRelease` produces an unsigned APK and `assembleDebug` still works.
    def propsFile = rootProject.file("keystore.properties")
    if (propsFile.exists()) {
        def props = new Properties()
        propsFile.withInputStream { props.load(it) }
        signingConfigs {
            release {
                storeFile rootProject.file(props["storeFile"])
                storePassword props["storePassword"]
                keyAlias props["keyAlias"]
                keyPassword props["keyPassword"]
            }
        }
        buildTypes.release.signingConfig signingConfigs.release
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Google's APK signing library — the engine behind the SDK's apksigner and Android Studio.
    implementation "com.android.tools.build:apksig:8.7.3"
}
