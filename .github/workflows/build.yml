name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write # needed to publish the "latest" release

jobs:
  build:
    # 24.04 runners come with the Android SDK preinstalled (ANDROID_HOME is set).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        run: |
          echo "Android SDK: $ANDROID_HOME"
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon assembleDebug 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Surface the failure as an annotation so it shows on the run's summary page
            summary=$(grep -E "^e: |error:|ERROR:|AAPT|What went wrong" -A 12 build.log | head -n 60 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Gradle build failed::${summary}"
          fi
          exit $status

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk NestSigner.apk

      - uses: actions/upload-artifact@v5
        with:
          name: NestSigner-debug
          path: NestSigner.apk

      # Publish to a "latest" release so there's a plain download link that works
      # on phones without signing in:
      # https://github.com/Techy-Nature/NestSigner/releases/latest/download/NestSigner.apk
      - name: Publish latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest NestSigner.apk \
            --target "$GITHUB_SHA" \
            --title "NestSigner (latest build)" \
            --notes "Built automatically from commit ${GITHUB_SHA::7}. Download **NestSigner.apk** below and open it on your Android device to install." \
            --latest
